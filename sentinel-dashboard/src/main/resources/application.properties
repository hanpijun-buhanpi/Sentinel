#spring settings
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

#cookie name setting
server.servlet.session.cookie.name=sentinel_dashboard_cookie

#logging settings
logging.level.org.springframework.web=INFO
logging.file.name=${user.home}/logs/csp/sentinel-dashboard.log
logging.pattern.file= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#auth settings
auth.filter.exclude-urls=/,/auth/login,/auth/logout,/registry/machine,/version
auth.filter.exclude-url-suffixes=htm,html,js,css,map,ico,ttf,woff,png
# If auth.enabled=false, Sentinel console disable login
auth.username=sentinel
auth.password=sentinel

#dynamic rules settings
rules.dynamic.type=default
#nacos
rules.dynamic.nacos.server-addr=localhost:8848
rules.dynamic.nacos.username=nacos
rules.dynamic.nacos.password=nacos
rules.dynamic.nacos.namespace=
#apollo
rules.dynamic.apollo.portal-url=http://localhost:8070
rules.dynamic.apollo.token=
rules.dynamic.apollo.connect-timeout=1000
rules.dynamic.apollo.read-timeout=5000
rules.dynamic.apollo.env=local
rules.dynamic.apollo.cluster=default
rules.dynamic.apollo.namespace=application
rules.dynamic.apollo.operator=apollo
#zookeeper
rules.dynamic.zookeeper.connect-string=localhost:2181
rules.dynamic.zookeeper.session-timeout=60000
rules.dynamic.zookeeper.connection-timeout=15000
rules.dynamic.zookeeper.retry-times=3
rules.dynamic.zookeeper.base-sleep-time=1000
rules.dynamic.zookeeper.max-sleep-time=5000

# Inject the dashboard version. It's required to enable
# filtering in pom.xml for this resource file.
sentinel.dashboard.version=@project.version@